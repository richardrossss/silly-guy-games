<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: full-screen canvas world; inventory chips top-left, mini-map top-right, talk button bottom-right; cards centered */
:root{

}
html,body{height:100%;margin:0;overflow:hidden;background:var(--grass);color:var(--ink);font-family:var(--display)}
body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}

.hud{position:absolute;top:10px;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));display:flex;gap:8px;align-items:flex-start;pointer-events:none}

.btn{pointer-events:auto;cursor:pointer;background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 3px 0 var(--ink);padding:5px;display:grid;place-items:center}
.btn:active{transform:translateY(3px);box-shadow:0 0 0 var(--ink)}
.btn:focus-visible{outline:4px solid var(--berry);outline-offset:2px}
#bagBtn{margin-left:auto;flex:none}#mapBtn{flex:none}
.mini{display:grid;grid-template-columns:repeat(2,18px);gap:3px}
.mini i{width:18px;height:18px;border-radius:5px;border:2px solid var(--ink);box-sizing:border-box;display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800;color:var(--ink);transition:background .6s}
#talkBtn{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:16px;width:62px;height:62px;border-radius:50%;padding:0}

.card{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding-inline:max(16px,env(safe-area-inset-left,0px));background:rgba(36,32,58,.25)}

let ac=null;

let house,stand,bowl,stump,stone,store,boss,giant,dinner,guides,funs,SG,shopShelby,SR={},keys=[],minis=[],pumpE,wcan;

  crowd=[];const mkS=(grp,x,y,h,i)=>crowd.push({kind:'sleeper',grp,x,y,h,col:COLS[i%8],ph:rnd(0,6),inf:0,awake:false,wakeAt:null,talkT:0,vo:{p:rnd(1.75,2.1),r:1.1}});

function drawIcon(type,x,y,s=1){

function drawHat(type,w,t){

  else if(type==='crown'){ctx.fillStyle='#ffd23f';ctx.beginPath();ctx.moveTo(-w*.6,-w*.1);ctx.lineTo(-w*.6,-w*.85);ctx.lineTo(-w*.3,-w*.45);ctx.lineTo(0,-w*1);ctx.lineTo(w*.3,-w*.45);ctx.lineTo(w*.6,-w*.85);ctx.lineTo(w*.6,-w*.1);ctx.closePath();ctx.fill();ctx.stroke();circ(0,-w*.35,w*.12,'#ff4d6d')}

function tubeMan(g,t,small){
  const {x,y}=g,h=g.h,e=ease(clamp(g.inf,0,1)),ph=g.ph||0;

  ctx.fillStyle='#4b4f5e';rr(x-w*.95,y-w*.75,w*1.9,w*.8,4);ctx.fill();ctx.lineWidth=2.5;ctx.strokeStyle=INK;ctx.stroke();

    const sway=(Math.sin(t*5.5+ph-f*3)*.2+Math.sin(t*10.5+ph*2-f*5)*.06)*h*f*(g.giant?.35:1);
    const ux=x+sway,uy=y-w*.6-f*h*(.93+.07*Math.sin(t*8+ph));
    const fx=x+f*flatLen,fy=y-w*.45+Math.sin(f*7+t*1.5)*1.5;
    pts.push([fx+(ux-fx)*e,fy+(uy-fy)*e])}
  const ai=Math.round(n*.62),ap=pts[ai];
  const arm=(bu,bf,side)=>{let a=bf+(bu-bf)*e,len=h*.15+h*.17*e,px=ap[0],py=ap[1];if(g.giant)len=Math.min(len,180);const p=[[px,py]];
    for(let k=0;k<3;k++){a+=e*Math.sin(t*9+ph+k*1.4+side)*.6;px+=Math.cos(a)*len/3;py+=Math.sin(a)*len/3;p.push([px,py])}
    path(p,w*.62+4,dk);path(p,w*.62,base)};
  arm(-2.5+Math.sin(t*7+ph)*.9,2.3,0);
  path(pts,w+5,dk);path(pts,w,base);
  if(g.acc==='spots')for(let i=1;i<n-1;i+=2)circ(pts[i][0]+(i%4===1?w*.18:-w*.18),pts[i][1],w*.15,'#ffffffcc');
  arm(-.65+Math.sin(t*6.3+ph+1)*.9,.85,2);
  if(!small){ctx.save();ctx.globalAlpha=.35;path(pts.slice(2,5),w*.35,'#ffffff');ctx.restore()}
  const hp=pts[n],hq=pts[n-1];let dx=hp[0]-hq[0],dy=hp[1]-hq[1];const L=Math.hypot(dx,dy)||1;dx/=L;dy/=L;
  const hat=g.hat||(g.acc==='crown'?'crown':null);
  if(!hat)for(let k=-2;k<=2;k++){const a=Math.atan2(dy,dx)+k*.38+Math.sin(t*12+k+ph)*.25*e,l=w*(.7+.25*(k%2?1:0));const p2=[[hp[0],hp[1]],[hp[0]+Math.cos(a)*l,hp[1]+Math.sin(a)*l]];path(p2,w*.22+3,dk);path(p2,w*.22,shade(base,.25))}
  const fx=hq[0]+(hp[0]-hq[0])*.25,fyy=hq[1]+(hp[1]-hq[1])*.25,er=w*.2;
  ctx.strokeStyle=INK;ctx.lineWidth=Math.max(1.5,w*.08);
  const talking=g.talkT>0;
  if(e>.3){
    for(const s of[-1,1]){circ(fx+s*w*.24,fyy-w*.05,er,'#fff',INK,Math.max(1.5,w*.08));circ(fx+s*w*.24+Math.sin(t*3+ph)*er*.4,fyy-w*.05,er*.5,INK)}

    else if(g.acc==='bow'){const b=pts[n-2];ctx.fillStyle='#ff4d6d';ctx.beginPath();ctx.moveTo(b[0],b[1]);ctx.lineTo(b[0]-w*.7,b[1]-w*.4);ctx.lineTo(b[0]-w*.7,b[1]+w*.4);ctx.closePath();ctx.moveTo(b[0],b[1]);ctx.lineTo(b[0]+w*.7,b[1]-w*.4);ctx.lineTo(b[0]+w*.7,b[1]+w*.4);ctx.closePath();ctx.fill();ctx.stroke();circ(b[0],b[1],w*.16,'#ff4d6d',INK,2)}}

    if(e.kind==='guy'){const top=e.inf>.5?Math.min(e.h,500):40;x0=e.x-45;x1=e.x+(e.inf<.5?Math.min(e.h*.8,150)+10:45);y0=e.y-top-30;y1=e.y+20}
    else{const [hw,ht]=e.hb||[60,80];x0=e.x-hw;x1=e.x+hw;y0=e.y-ht;y1=e.y+18}
    if(wx>=x0&&wx<=x1&&wy>=y0&&wy<=y1&&(!best||e.y>best.y))best=e}return best}

function routeTo(z){const cz=zoneOf(P.x,P.y);if(cz===z)return null;const fwd=z>cz,gi=fwd?cz:cz-1,G=GSIDE[gi],open=S.gate[gi]>.7;const p=open?(fwd?G.pb:G.pa):(fwd?G.pa:G.pb);return{kind:'wp',x:p[0],y:p[1]}}
function goal(){
  if(S.scene==='room')return S.doorT<0?'door':null;
  if(S.scene==='map')return S.mapMove?null:mapGoal();
  if(S.scene==='land')return(L&&!L.done&&!L.brushing)?L.goal():null;
  if(S.scene==='shop'){if(L&&L.id==='city'&&L.step===1&&!L.tea&&!L.blue.happy){const tl=SHOP.lay.tiles.find(x=>x.id==='tea');if(tl)return{kind:'wp',x:tl.x+tl.w/2,y:tl.y,top:4};return'shdoor'}return(SHOP.T>12||(L&&L.tea))?'shdoor':null}
  if(S.scene==='store'){const needs=guys.some(g=>g.state==='popped');if(needs&&!S.carrying)return S.storeSel||SG.find(g=>!g.sold)||'sdoor';return(S.carrying||S.storeT>8)?'sdoor':null}
  if(S.won)return null;
  {const kz=[0,1,2].find(k=>S.zd[k]&&!S.gateOpening[k]);if(kz!=null){const K=keys[kz];return K.got?{kind:'wp',x:GSIDE[kz].pa[0],y:GSIDE[kz].pa[1]}:(K.shown?K:guides[kz])}}
  const z=S.zd.indexOf(false);if(z<0)return dinner;
  if(z>0&&!S.met[z]){return routeTo(z)||guides[z]}
  const r=routeTo(z);if(r)return r;
  if(z===0){const fl=zoneGuys(0).filter(g=>g.state!=='on');
    if(S.juice>0)return nearest(fl);if(S.apples>0)return stand;if(drops.length)return nearest(drops);
    return nearest(trees.filter(t=>t.apples>0))||nearest(trees)}
  if(z===1){const hun=zoneGuys(1).filter(g=>g.state!=='on');if(S.salad>0)return nearest(hun);if(!S.hasCan)return wcan;
    if(S.vt.lettuce&&S.vt.tomato&&S.vt.cucumber)return bowl;const ready=plots.filter(p=>p.g>=1&&p.veg!=='carrot'),dry=plots.filter(p=>!p.wet&&p.g<1&&p.veg!=='carrot');return nearest(ready.length?ready:dry.length?dry:plots)}
  if(z===2){if(S.sword)return nearest(zoneGuys(2).filter(g=>g.state==='cloudy'));if(S.stoneOpen)return stone;if(S.puppy)return funs.find(f=>f.type==='bells');if(S.magic>=5)return stump;return nearest(sparks)}
  const popped=guys.find(g=>g.state==='popped');if(popped)return S.carrying?popped:store;
  if(boss.hp>0)return boss;if(minis.length)return nearest(minis);if(S.pumpPhase)return pumpE;return dinner;
}

/* ---------- input ---------- */
function pickEnt(wx,wy){
  let best=null;
  const cands=[...ents.filter(e=>!(e.kind==='dinner'&&e.show<=0)&&!(e.kind==='boss'&&e.hp<=0)&&!(e.kind==='stump'&&e.done)&&!(e.kind==='wcan'&&e.taken)&&!(e.kind==='pump'&&!S.pumpPhase))];
  for(const e of cands){let x0,x1,y0,y1;
    if(e.kind==='guy'){const top=e.inf>.5?Math.min(e.h,500):40;x0=e.x-45;x1=e.x+(e.inf<.5?Math.min(e.h*.8,150)+10:45);y0=e.y-top-30;y1=e.y+20}
    else if(e.kind==='boss'){x0=e.x-90*e.s;x1=e.x+90*e.s;y0=e.y-70*e.s;y1=e.y+60*e.s}
    else{const [hw,ht]={wcan:[40,60],pump:[44,110],tree:[70,150],stand:[86,225],store:[120,200],house:[95,170],plot:[50,60],bowl:[80,110],stump:[40,50],stone:[55,130],dinner:[170,150]}[e.kind]||[60,80];x0=e.x-hw;x1=e.x+hw;y0=e.y-ht;y1=e.y+18}
    if(wx>=x0&&wx<=x1&&wy>=y0&&wy<=y1&&(!best||e.y>best.y))best=e}
  return best;
}
function approach(e){if(e.kind==='guy')return[e.x-10,e.y+30];if(e.kind==='store')return[e.x-60,e.y+34];if(e.kind==='boss')return[e.x,e.y];if(e.kind==='plot')return[e.x,e.y+6];return[e.x,e.y+34]}

    if(wx>R.doorX-50&&wx<R.doorX+50&&wy>R.fy-180&&wy<R.fy+10){P.target='door';P.tx=R.doorX;P.ty=R.fy+26}else{P.target=null;P.tx=clamp(wx,24,R.RW-24);P.ty=clamp(wy,R.RH*.22,R.RH-20)}return}

  for(const m of minis)if(Math.hypot(wx-m.x,wy-(m.y-30))<70){if(S.sword&&Math.hypot(P.x-m.x,P.y-m.y)<340){zapMini(m);return}goPlan(m.x,m.y,null);return}

  else if(e)[tx,ty]=approach(e);else{tx=wx;ty=wy}

function goPlan(tx,ty,target){let cz=zoneOf(P.x,P.y);const tz=zoneOf(tx,ty),via=[];let ok=true;P.blocked=null;
  while(cz!==tz){const fwd=tz>cz,gi=fwd?cz:cz-1,G=GSIDE[gi];if(S.gate[gi]<.7){via.push(fwd?G.pa:G.pb);ok=false;P.blocked=gi;break}
    via.push(...(fwd?[G.pa,G.g,G.pb]:[G.pb,G.g,G.pa]));cz=fwd?cz+1:cz-1}

  ctx.fillStyle='#9fd6ff';ctx.fillRect(0,0,RW,fy);
  for(let i=0;i<7;i++){const x=(i*157)%RW,y=40+(i*73)%Math.max(60,fy-140);for(const [dx,dy,r] of[[-14,0,12],[0,-6,15],[14,0,11]])circ(x+dx,y+dy,r,'rgba(255,255,255,.55)')}
  ctx.fillStyle='#d98c4a';ctx.fillRect(0,fy,RW,RH-fy);ctx.strokeStyle='#b8733a';ctx.lineWidth=2;for(let y=fy+24;y<RH;y+=26){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(RW,y);ctx.stroke()}
  ctx.fillStyle='#fff';ctx.fillRect(0,fy-8,RW,10);ctx.strokeStyle=INK;ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(0,fy+2);ctx.lineTo(RW,fy+2);ctx.stroke();
  const wx=RW*.42,wy=fy*.28;ctx.fillStyle='#d8f6ff';rr(wx-55,wy,110,90,8);ctx.fill();ctx.stroke();
  ctx.save();ctx.beginPath();ctx.rect(wx-53,wy+2,106,86);ctx.clip();tubeMan({x:wx+18,y:wy+96,h:74,col:'#ffd23f',state:'on',inf:1,ph:1,hat:'flower',role:'guide',talkT:speech.some(s=>s.who==='window')?1:0},t,true);ctx.restore();
  ctx.lineWidth=3;ctx.strokeStyle=INK;ctx.beginPath();ctx.moveTo(wx,wy);ctx.lineTo(wx,wy+90);ctx.moveTo(wx-55,wy+45);ctx.lineTo(wx+55,wy+45);ctx.stroke();rr(wx-55,wy,110,90,8);ctx.stroke();
  const by=fy+30;ctx.fillStyle='#3fa7ff';rr(16,by-36,130,54,10);ctx.fill();ctx.stroke();ctx.fillStyle='#fff';rr(22,by-46,42,22,8);ctx.fill();ctx.stroke();ctx.fillStyle='#8a5a33';rr(10,by-70,14,96,5);ctx.fill();ctx.stroke();
  for(let i=0;i<4;i++)circ(76+i*18,by-14,4,'#ffd23f');
  ell(RW*.48,fy+(RH-fy)*.55,Math.min(150,RW*.3),40,'#ff6fb5');ctx.lineWidth=3;ctx.stroke();ell(RW*.48,fy+(RH-fy)*.55,Math.min(110,RW*.22),26,'#ffd23f');
  drawRoomToys(t);ctx.strokeStyle=INK;ctx.lineWidth=3;
  const open=S.doorT<0?0:Math.min(1,S.doorT/.6);

  if(open>0){const lg=ctx.createLinearGradient(doorX,fy-170,doorX,fy);lg.addColorStop(0,'#bdf0ff');lg.addColorStop(.55,'#d9fbff');lg.addColorStop(.56,'#7ed957');lg.addColorStop(1,'#5cc244');ctx.fillStyle=lg;ctx.fillRect(doorX-42,fy-168,84,168);
    ctx.save();ctx.beginPath();ctx.rect(doorX-42,fy-168,84,168);ctx.clip();for(let i=0;i<3;i++)tubeMan({x:doorX-24+i*24,y:fy-58+i*4,h:46,col:COLS[i+1],state:'on',inf:open,ph:i},t,true);ctx.restore();
    ctx.fillStyle=`rgba(255,250,200,${.35*open})`;ctx.beginPath();ctx.moveTo(doorX-42,fy);ctx.lineTo(doorX+42,fy);ctx.lineTo(doorX+90,RH);ctx.lineTo(doorX-140,RH);ctx.fill()}
  ctx.fillStyle='#ffb347';rr(doorX-42,fy-168,84*(1-open*.85),168,4);ctx.fill();ctx.stroke();
  if(open<.5)circ(doorX+28-84*open,fy-82,6,'#ffd23f',INK);
  drawPlayer(P.x,P.y,t);
  if(S.rt.dark>.01){const d=S.rt.dark;ctx.fillStyle=`rgba(24,18,60,${.62*d})`;ctx.fillRect(0,0,RW,RH);ctx.save();ctx.globalAlpha=d;for(let i=0;i<16;i++)star((i*97+30)%RW,20+(i*53)%Math.max(40,fy*.6),6+Math.sin(t*3+i)*2,'#fff6b0',t*.3+i);ctx.restore()}
}
function drawArrow(tg,t){
  if(!tg)return;let x,y;if(tg==='door'){x=R.doorX;y=R.fy-190}else if(tg==='sdoor'){x=SR.doorX;y=SR.fy-168}else if(tg==='shdoor'){x=SHOP.lay.doorX;y=SHOP.lay.fy-200}else[x,y]=topOf(tg);
  const cw=vw/zoom,ch=vh/zoom,sx=x-cam.x,sy=y-cam.y,m=46,inside=sx>m&&sx<cw-m&&sy>80&&sy<ch-90;
  ctx.save();ctx.setTransform(dpr*zoom,0,0,dpr*zoom,0,0);let px,py,ang;
  if(inside){px=sx;py=sy-8-Math.abs(Math.sin(t*5))*12;ang=Math.PI/2}
  else{const cx=cw/2,cy=ch/2,dx=sx-cx,dy=sy-cy,k=Math.min((cw/2-m)/Math.abs(dx||1),(ch/2-95)/Math.abs(dy||1));px=cx+dx*k;py=cy+dy*k;ang=Math.atan2(dy,dx);const b=Math.sin(t*6)*5;px+=Math.cos(ang)*b;py+=Math.sin(ang)*b}
  ctx.translate(px,py);ctx.rotate(ang);ctx.fillStyle='#ffd23f';ctx.strokeStyle=INK;ctx.lineWidth=3.5;ctx.lineJoin='round';
  ctx.beginPath();ctx.moveTo(16,0);ctx.lineTo(-6,-17);ctx.lineTo(-6,-7);ctx.lineTo(-22,-7);ctx.lineTo(-22,7);ctx.lineTo(-6,7);ctx.lineTo(-6,17);ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
}
function render(){
  const t=S.t;
  ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle='#7ed957';ctx.fillRect(0,0,vw,vh);
  {const sh=S.shake>0?S.shake:0;ctx.setTransform(dpr*zoom,0,0,dpr*zoom,(-cam.x+rnd(-7,7)*sh)*dpr*zoom,(-cam.y+rnd(-7,7)*sh)*dpr*zoom)}
  if(S.scene==='room')drawRoom(t);else if(S.scene==='store')drawStoreInt(t);else if(S.scene==='shop'&&SHOP)drawShopScene(t);else if(S.scene==='land'&&L)L.draw(t);else if(S.scene==='map')drawMapScene(t);else drawWorld(t);

    if(p.fly){const k=1-p.life/p.max;drawIcon(p.fly,p.x+(p.tx-p.x)*k,p.y+(p.ty-p.y)*k-Math.sin(k*Math.PI)*60,1.3);continue}
    if(p.zap){ctx.save();ctx.globalAlpha=p.life/p.max;ctx.shadowColor='#bff3ff';ctx.shadowBlur=14;const pts=[[p.x,p.y]];for(let i=1;i<6;i++){const k=i/6;pts.push([p.x+(p.tx-p.x)*k+rnd(-12,12),p.y+(p.ty-p.y)*k+rnd(-12,12)])}pts.push([p.tx,p.ty]);path(pts,6,'#bff3ff');path(pts,2.5,'#ffffff');ctx.restore();continue}
    if(p.blk){p.rot+=p.vr*.016;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.col;ctx.strokeStyle=INK;ctx.lineWidth=2.5;rr(-15,-15,30,30,4);ctx.fill();ctx.stroke();ctx.restore();continue}
    if(p.puff){ctx.globalAlpha=Math.min(1,p.life);circ(p.x,p.y,p.r*(1.6-p.life*.4),p.col);ctx.globalAlpha=1;continue}
    if(p.txt){ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=INK;ctx.font='800 18px '+FONT;ctx.textAlign='center';ctx.fillText(p.txt,p.x,p.y);ctx.globalAlpha=1;continue}
    ctx.globalAlpha=Math.min(1,p.life*1.5);ctx.fillStyle=p.col;ctx.fillRect(p.x-p.r/2,p.y-p.r/2,p.r,p.r*1.4);ctx.globalAlpha=1}
  for(const s of speech){if(s.scene!==S.scene)continue;const [x,y]=topOf(s.who);bubble(x,y,s.text,Math.min(1,s.life*3,(s.max-s.life)*6+.2))}
  if(S.playing&&S.fadeDir===0&&!S.ov)drawArrow(goal(),t);
  if(S.scene==='land'&&L&&L.drawTop)L.drawTop(t);
  if(S.ov){ctx.setTransform(dpr,0,0,dpr,0,0);S.ov.draw(t)}
  if(S.fade>0){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle=`rgba(255,255,255,${S.fade})`;ctx.fillRect(0,0,vw,vh)}
}

let lastInv='';
function hud(){
  const wl=[['apple',S.apples],['veg',S.veg],['magic',S.magic],['blk',S.blocks]],items=(S.scene==='land'&&L?[...L.inv(),...wl]:[['juice',S.juice],['salad',S.salad],...wl,['sword',S.sword?-1:0],['key',S.keyHas.some(Boolean)?-1:0]]).filter(i=>i[1]);
  const key=items.map(i=>i.join(':')).join(',');
  if(key!==lastInv){lastInv=key;$('inv').innerHTML=items.map(([k,v])=>`<div class="pill">${ICONSVG[k]}${v>0?`<span>${v}</span>`:''}</div>`).join('')}
  const show=S.playing&&S.scene!=='room'&&S.scene!=='map'&&$('win').hidden&&!S.ov;$('hud').hidden=!show;$('talkBtn').hidden=!show;
  const mini=$('mini').children,order=[3,2,0,1];
  order.forEach((z,i)=>{const el=mini[i];el.style.background=S.reveal[z]<.5?'#3d2f66':(S.zd[z]?ZONES[z].ground:mix(ZONES[z].ground,'#3d2f66',.3));el.textContent=S.zd[z]?'★':''});

  const mc=$('mapCv'),m=mc.getContext('2d'),s=600/W,t=S.t;

function frame(now){const dt=Math.min(.05,(now-prev)/1000);prev=now;update(dt);ctx=ctxMain;render();hud();if(!$('mapCard').hidden)drawMap();requestAnimationFrame(frame)}
function start(quiet){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();ac.resume()}catch(e){}
  $('title').hidden=true;S.playing=true;sfx.tap();
  if(!quiet)talk('window','Come outside and play! Tap the door!','Come outside!',true);
}

  for(const g of guys){g.state='on';g.inf=1}giant.h=giant.hT=1000;boss.hp=0;boss.gone=1;dinner.show=1;S.puppy=true;S.sword=true;stump.done=true;stone.taken=true;

reset();roomSetup();requestAnimationFrame(frame);
})();
